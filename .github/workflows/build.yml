name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      options: --privileged
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build debug APK
        shell: bash
        run: |
          export PIP_NO_CACHE_DIR=1
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee /tmp/build.log
        continue-on-error: true

      - name: Show error lines
        if: always()
        shell: bash
        run: |
          echo "===== LAST 40 LINES ====="
          tail -n 40 /tmp/build.log || true
          echo "===== ERROR LINES ====="
          grep -nE "# ERROR|# \(\)|ERROR:|Traceback|Error:|failed|Command failed|not found|No matching" /tmp/build.log | tail -n 40 || true

      - name: Fail if no APK
        if: always()
        shell: bash
        run: |
          if ls bin/*.apk >/dev/null 2>&1; then
            echo "APK OK"
          else
            echo "::error::No APK produced - see 'Show error lines' step above"
            exit 1
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JSStudio-APK
          path: bin/*.apk
          if-no-files-found: warn
